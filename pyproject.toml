# PROJECT BOND — the_living_daylights (The Living Daylights, 1987) · SNIPER'S NEST
# Standalone checkout (public remote: github.com/docxology/bond-the_living_daylights).
# The mission protocol (bond_api) is a FROZEN dependency, vendored under vendor/bond-api/.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the_living_daylights"
version = "0.1.0"
license = {text = "MIT"}
description = "SNIPER'S NEST — special-agent mission software for The Living Daylights (1987): sniper ballistics, defection-handling, mountain/desert terrain ops"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api",
]

[tool.uv.sources]
# FROZEN protocol dependency — films code against bond_api, never invent types.
# Vendored at vendor/bond-api/ (provenance: vendor/bond-api/VENDOR.md): a single-repository clone
# — Dependabot's update jobs, or anyone's — resolves it in-tree, with no sibling checkout.
# scripts/vendor.py --check keeps the copy byte-identical to upstream docxology/bond-api.
bond-api = { path = "vendor/bond-api" }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src", "scripts"]
# The vendored copy is a dependency; its own upstream gate covers it, and vendor.py --check binds
# its bytes. Type errors inside it are upstream's to fix, not this tree's to patch.
exclude = ["(^|/)vendor/"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]
# The vendored copy is byte-identical to upstream and must stay that way; its own gate covers it.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "E501",  # line length enforced by ruff format
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Standalone checkout; when nested in the suite the root pyproject.toml carries
# the workspace settings this tree inherits.
