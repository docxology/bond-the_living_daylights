# Sourced numeric claims registered for evidence-registry validation.
# Every claim is computed deterministically by the mission solution; none are
# hand-authored in prose. Local-only tree.

claims:
  - key: zero_elevation_mrad
    source: compute_mission.mission_solution()["ballistics"]["elevation_mrad"]
    description: "Muzzle elevation to zero the 7.62mm service round at 300 m."
    kind: computed
  - key: near_far_zero
    source: compute_mission.mission_solution()["ballistics"]
    description: "Near and far zero ranges of the zeroed trajectory."
    kind: computed
  - key: wind_hold_mrad
    source: compute_mission.mission_solution()["ballistics"]["wind_hold_mrad"]
    description: "Wind hold to cancel a 5 m/s crosswind at 300 m."
    kind: computed
  - key: defection_plan_verdict
    source: compute_mission.mission_solution()["defection"]["plan_verdict"]
    description: "KOSKOV defection plan verdict from the staged risk model."
    kind: computed
  - key: route_mean_cover
    source: compute_mission.mission_solution()["terrain"]["mean_cover"]
    description: "Mean concealment of the planned exfil route."
    kind: computed
